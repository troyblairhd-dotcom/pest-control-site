<html lang="en">
<head>

<meta charset="utf-8">

<title>Spider Control Scottsboro AL | Custom Pest Control Scottsboro</title>
<meta name="description" content="Professional spider control in Scottsboro and Northeast Alabama. Targeted treatments for common spiders, webs, and hiding places. Free quote — call 256-293-4433.">
<meta name="theme-color" content="#103e30">
<style>
:root{--green:#103e30;--deep:#092a22;--lime:#d9edaa;--olive:#567b2d;--cream:#f7f5ec;--ink:#183b31;--muted:#56665e;--line:#d9e0d5}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:20px}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.65}
a{color:inherit}
h1,h2,h3,p{margin-top:0}
h1,h2,h3{line-height:1.12}
h1{font-size:clamp(42px,5.4vw,72px);letter-spacing:-.05em;margin-bottom:24px}
h2{font-size:clamp(32px,3.5vw,46px);letter-spacing:-.035em;margin-bottom:22px}
h3{font-size:21px;margin-bottom:13px}
p{margin-bottom:18px}
.wrap{width:min(1120px,calc(100% - 48px));margin:auto}
.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:800;color:var(--olive);margin-bottom:18px}
.topbar{background:var(--deep);color:var(--lime);text-align:center;padding:9px 20px;font-size:11px;letter-spacing:.09em}
.header{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:10px 0}
.brand{display:flex;align-items:center;gap:18px;text-decoration:none}
.logo-frame{display:block;width:190px;height:122px;position:relative;overflow:hidden;flex-shrink:0}
.logo-frame img{position:absolute;width:240px;height:240px;max-width:none;left:-25px;top:-52px;mix-blend-mode:multiply}
.brand-note{font-size:11px;line-height:1.6;border-left:1px solid var(--line);padding-left:18px;color:var(--muted)}
nav{display:flex;align-items:center;gap:23px;font-size:13px;font-weight:bold}
nav a{text-decoration:none}
nav a:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:16px;padding:15px 23px;border-radius:8px;background:var(--green);color:white;text-decoration:none;font-weight:700;font-size:14px;border:1px solid var(--green)}
.btn:hover{background:var(--deep)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--deep)}
.btn.light{background:transparent;color:var(--green);border-color:var(--line)}
a:focus-visible,summary:focus-visible{outline:3px solid #80a844;outline-offset:5px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero{padding:56px 0 68px;display:grid;grid-template-columns:1.2fr 1fr;gap:66px;align-items:center}
.hero h1 span{color:var(--olive)}
.lead{font-size:18px;color:var(--muted);max-width:620px}
.micro{font-size:12px;color:var(--muted);margin:17px 0 0}
.hero-card{background:var(--green);color:white;padding:38px;border-radius:24px;position:relative;overflow:hidden;box-shadow:0 18px 45px #092a2212}
.hero-card .eyebrow{color:var(--lime)}
.hero-card h2{font-size:34px}
.hero-card>p{color:#d7e3db}
.card-row{display:grid;grid-template-columns:36px 1fr;gap:14px;padding:19px 0;border-top:1px solid #ffffff26}
.card-row span{color:var(--lime);font-size:13px;font-weight:bold}
.card-row h3{font-size:17px;margin:0 0 7px}
.card-row p{font-size:13px;color:#d7e3db;margin:0}
.card-foot{margin-top:17px;background:var(--lime);color:var(--deep);padding:14px 18px;border-radius:8px;font-size:13px;font-weight:bold}
.proof{border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:25px 0;gap:22px}
.proof strong{display:block;font-size:20px;line-height:1.2;margin-bottom:7px}
.proof span{font-size:12px;color:var(--muted)}
.section{padding:84px 0}
.intro{max-width:710px;margin-bottom:35px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
.quote-panel{border-left:4px solid var(--olive);padding:8px 0 8px 27px}
.quote-panel p{font-size:25px;line-height:1.45;letter-spacing:-.02em;margin-bottom:13px}
.quote-panel small{font-size:12px;color:var(--muted)}
.white{background:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.tile{padding:28px;border:1px solid var(--line);border-radius:16px;background:white}
.tile .number{font-size:12px;letter-spacing:.12em;color:var(--olive);display:block;margin-bottom:24px;font-weight:bold}
.tile p{font-size:14px;color:var(--muted);margin:0}
.process{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.process article{padding:29px;background:var(--cream);border-radius:14px}
.process article p{font-size:14px;color:var(--muted);margin:0}
.step{font-size:12px;color:var(--olive);font-weight:bold;display:block;margin-bottom:14px}
.note{padding:22px 25px;background:#edf2e3;border-left:3px solid var(--olive);border-radius:0 10px 10px 0;margin-top:25px;font-size:14px}
.note p:last-child{margin:0}
.dark{background:var(--deep);color:white}
.dark .eyebrow{color:var(--lime)}
.dark .lead{color:#cbdad2}
.pest-list{display:flex;flex-wrap:wrap;gap:9px;list-style:none;padding:0;margin:22px 0}
.pest-list li{padding:8px 14px;border-radius:6px;background:#edf2e3;font-size:13px}
.coverage-box{border:1px solid var(--line);border-radius:18px;padding:30px;background:white}
.coverage-box p{font-size:14px;color:var(--muted)}
.small{font-size:12px!important;color:var(--muted)}
details{padding:21px 0;border-bottom:1px solid var(--line)}
summary{font-size:17px;font-weight:bold;cursor:pointer;line-height:1.4}
details p{margin:15px 0 0;color:var(--muted);font-size:14px}
.cta{background:var(--green);padding:48px;border-radius:22px;color:white;display:grid;grid-template-columns:1.3fr 1fr;gap:42px;align-items:center}
.cta .eyebrow{color:var(--lime)}
.cta h2{margin-bottom:17px}
.cta p{color:#d7e3db;margin:0}
.cta-contact{text-align:center}
.cta-contact .btn{width:100%}
.cta-contact a.phone{display:block;font-size:26px;text-decoration:none;font-weight:bold;margin-top:20px}
.cta-contact small{font-size:12px;color:#d7e3db}
footer{padding:35px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.footer-inner{display:flex;justify-content:space-between;gap:25px}
footer strong{color:var(--ink);font-size:15px}
footer p{margin:6px 0}
.skip{position:absolute;left:15px;top:-100px;background:white;padding:12px;z-index:10}
.skip:focus{top:15px}

@media(max-width:960px){nav a:not(.nav-phone){display:none}
.brand-note{display:none}
.hero{gap:30px}
.hero-card{padding:27px}
.split{gap:35px}
}

@media(max-width:680px){.wrap{width:calc(100% - 36px)}
.topbar{font-size:10px}
.header{gap:10px}
.logo-frame{width:155px;height:101px}
.logo-frame img{width:200px;height:200px;left:-23px;top:-44px}
nav{font-size:12px}
.hero{grid-template-columns:1fr;padding:30px 0 40px;gap:30px}
.hero h1{font-size:46px}
.hero-card h2{font-size:30px}
.proof{grid-template-columns:1fr 1fr}
.proof strong{font-size:18px}
.section{padding:55px 0}
.split,.grid3,.cta{grid-template-columns:1fr;gap:22px}
.included{align-items:flex-start;flex-direction:column}
.cta{padding:30px 23px}
.footer-inner{flex-direction:column;gap:15px}
.quote-panel p{font-size:23px}
.lead{font-size:17px}
}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}
}

@media print{nav,.actions,.cta-contact,.skip{display:none}
.section{padding:25px 0}
.hero{padding:25px 0}
body{background:white}
.hero-card,.dark,.cta{-webkit-print-color-adjust:exact;print-color-adjust:exact}
article,.tile,.coverage-box{break-inside:avoid}
}

</style>
</head>
