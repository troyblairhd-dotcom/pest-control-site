<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Custom Pest Control Scottsboro</title>
  <meta http-equiv="refresh" content="8; url=/">
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f7f7f7;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      padding: 48px 40px;
      text-align: center;
      max-width: 480px;
    }
    .check {
      font-size: 48px;
      color: #2e7d32;
      margin-bottom: 16px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 12px; }
    p { font-size: 1.05rem; color: #555; line-height: 1.6; margin: 0 0 8px; }
    .back {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      background: #2e7d32;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
    .back:hover { background: #1b5e20; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>Thank You!</h1>
    <p>Your request has been sent. We'll get back to you as soon as possible.</p>
    <p>For urgent pest issues, call us directly.</p>
    <a href="/" class="back">Back to Home</a>
  </div>
</body>
</html>
